<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Guestbook</title>

</head>
<body>
  <h1>Guestbook</h1>

  <form id="guestbookForm">

  <div id="entries"></div>
  
  <script src="script.js"></script>
</body>
</html>
